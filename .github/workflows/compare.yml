name: compare
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: compare trees
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["GH_TOKEN"]
          def api(path):
              req = urllib.request.Request("https://api.github.com" + path, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "tree-compare"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          def meta(full):
              try:
                  r = api("/repos/" + full)
                  return {k: r.get(k) for k in ("full_name","fork","default_branch","created_at") } | {"parent": (r.get("parent") or {}).get("full_name"), "source": (r.get("source") or {}).get("full_name")}
              except Exception as e:
                  return {"error": str(e)}
          def tree(full, branch):
              try:
                  commit = api(f"/repos/{full}/commits/{branch}")
                  tree = api(f"/repos/{full}/git/trees/{commit['commit']['tree']['sha']}?recursive=1")
                  return {i["path"]: i["sha"] for i in tree["tree"] if i["type"] == "blob"}
              except Exception as e:
                  print("TREE ERROR", full, branch, e)
                  return {}
          print("UPSTREAM META", json.dumps(meta("academicpages/academicpages.github.io")))
          for repo in ["nextatlas20/Northglass-Open-Night-427", "nextatlas20/Tidebridge-Ferry-Board-426"]:
              print("REPO META", repo, json.dumps(meta(repo)))
          up = tree("academicpages/academicpages.github.io", "master")
          for repo in ["nextatlas20/Northglass-Open-Night-427", "nextatlas20/Tidebridge-Ferry-Board-426"]:
              t = tree(repo, "master")
              if not t:
                  continue
              print("=== DIFF", repo, "===")
              allp = sorted(set(up) | set(t))
              diffs = [p for p in allp if up.get(p) != t.get(p)]
              for p in diffs:
                  print(p, "UP=" + str(up.get(p)), "FORK=" + str(t.get(p)))
              print("DIFF COUNT", len(diffs))
          PY
